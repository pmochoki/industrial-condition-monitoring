[project]
name = "industrial-condition-monitoring"
version = "0.1.0"
description = "Predictive maintenance and condition monitoring node for industrial machinery"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Dependencies will be added incrementally per phase:
# Phase 2: numpy, scipy (simulator)
# Phase 3: numpy, scipy (signal processing)
# Phase 5: paho-mqtt
# Phase 6: fastapi, uvicorn, sqlalchemy, pydantic, paho-mqtt
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["simulator*", "edge*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
